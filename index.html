<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel de Tareas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<button class="icon-btn" onclick="toggleSidebar()" data-tip="Mostrar/ocultar lista">☰</button>
<h1>Panel de Tareas</h1>
<button class="icon-btn primary" onclick="abrirModalNueva()" data-tip="Nueva tarea">＋</button>
<button class="icon-btn orange" onclick="exportarJSON()" data-tip="Exportar respaldo">⬇</button>
<button class="icon-btn orange" onclick="document.getElementById('fileImport').click()" data-tip="Importar respaldo">⬆</button>

<input type="file" id="fileImport" accept=".json" style="display:none" onchange="importarJSON(event)">
</header>
<div class="layout">
<aside class="sidebar" id="sidebar">
<div class="sidebar-head"><h2>Sin asignar</h2><span class="count" id="countSinAsignar">0</span><input type="checkbox" id="chkAllSidebar" onchange="toggleSeleccionTodas()" style="margin-left:8px;cursor:pointer" title="Seleccionar todas"><button class="icon-btn" id="btnDeleteSel" onclick="borrarSeleccionadas()" data-tip="Eliminar seleccionadas" style="display:none;background:#dc2626;color:#fff;margin-left:auto;width:28px;height:28px;font-size:13px">🗑</button></div>
<div class="search"><input id="search" placeholder="Buscar tarea..." oninput="renderLista()"></div>
<div class="task-list" id="lista"></div>
</aside>
<main class="calendar-wrap">
<div class="week-nav">
<button class="icon-btn" onclick="cambiarSemana(-1)" data-tip="Semana anterior">◀</button>
<span class="label" id="weekLabel"></span>
<button class="icon-btn" onclick="cambiarSemana(1)" data-tip="Semana siguiente">▶</button>
<span style="flex:1"></span>
<button class="icon-btn" onclick="irHoy()" data-tip="Ir a la semana actual">⌂</button>
</div>
<table class="cal"><thead><tr id="theadRow"></tr></thead><tbody id="tbody"></tbody></table>
</main>
</div>
<div class="modal-bg" id="modalBg">
<div class="modal">
<h3 id="modalTitle">Tarea</h3>
<label>Nombre</label><input id="inpNombre">
<label>Categoría</label><input id="inpCat" placeholder="Ej: Pagos, Obra...">
<label>Estado</label><select id="inpEstado"><option value="sininiciar">Sin iniciar</option><option value="pendiente">Pendiente</option><option value="completada">Completada</option><option value="cancelada">Cancelada</option></select>
<label>% Avance</label><input id="inpAvance" type="number" min="0" max="100" value="0">
<label>Comentario</label><textarea id="inpComentario"></textarea>
<div class="actions"><button class="btn-del" onclick="borrarTarea()">Eliminar</button><button class="btn-cancel" onclick="cerrarModal()">Cancelar</button><button class="btn-save" onclick="guardarTarea()">Guardar</button></div>
</div>
</div>
<div class="toast" id="toast"></div>
<div id="importProgress" style="display:none;position:fixed;top:0;left:0;right:0;z-index:300;background:#1f3b73;color:#fff;padding:8px 16px;font-size:12px;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.2)">
<div id="importText" style="margin-bottom:4px">Importando...</div>
<div style="height:4px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden"><div id="importBar" style="height:100%;width:0%;background:#4ade80;transition:width .2s"></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
